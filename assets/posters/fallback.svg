<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 450" width="300" height="450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0c1017;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1f2e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="stripe" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#e50914;stop-opacity:0.85" />
      <stop offset="100%" style="stop-color:#b0060f;stop-opacity:0.85" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="300" height="450" fill="url(#bg)" rx="8" ry="8"/>

  <!-- Film strip top -->
  <rect x="0" y="0" width="300" height="36" fill="#0a0d14" rx="8" ry="8"/>
  <rect x="0" y="26" width="300" height="10" fill="#0a0d14"/>
  <rect x="12" y="6" width="20" height="24" fill="#1a2035" rx="3"/>
  <rect x="42" y="6" width="20" height="24" fill="#1a2035" rx="3"/>
  <rect x="72" y="6" width="20" height="24" fill="#1a2035" rx="3"/>
  <rect x="102" y="6" width="20" height="24" fill="#1a2035" rx="3"/>
  <rect x="132" y="6" width="20" height="24" fill="#1a2035" rx="3"/>
  <rect x="162" y="6" width="20" height="24" fill="#1a2035" rx="3"/>
  <rect x="192" y="6" width="20" height="24" fill="#1a2035" rx="3"/>
  <rect x="222" y="6" width="20" height="24" fill="#1a2035" rx="3"/>
  <rect x="252" y="6" width="20" height="24" fill="#1a2035" rx="3"/>

  <!-- Film strip bottom -->
  <rect x="0" y="414" width="300" height="36" fill="#0a0d14" rx="8" ry="8"/>
  <rect x="0" y="414" width="300" height="10" fill="#0a0d14"/>
  <rect x="12" y="420" width="20" height="24" fill="#1a2035" rx="3"/>
  <rect x="42" y="420" width="20" height="24" fill="#1a2035" rx="3"/>
  <rect x="72" y="420" width="20" height="24" fill="#1a2035" rx="3"/>
  <rect x="102" y="420" width="20" height="24" fill="#1a2035" rx="3"/>
  <rect x="132" y="420" width="20" height="24" fill="#1a2035" rx="3"/>
  <rect x="162" y="420" width="20" height="24" fill="#1a2035" rx="3"/>
  <rect x="192" y="420" width="20" height="24" fill="#1a2035" rx="3"/>
  <rect x="222" y="420" width="20" height="24" fill="#1a2035" rx="3"/>
  <rect x="252" y="420" width="20" height="24" fill="#1a2035" rx="3"/>

  <!-- Red accent bar -->
  <rect x="0" y="36" width="6" height="378" fill="url(#stripe)"/>
  <rect x="294" y="36" width="6" height="378" fill="url(#stripe)"/>

  <!-- Camera icon circle -->
  <circle cx="150" cy="185" r="52" fill="none" stroke="#e50914" stroke-width="2" opacity="0.6" filter="url(#glow)"/>
  <circle cx="150" cy="185" r="42" fill="#e50914" opacity="0.1"/>

  <!-- Camera body -->
  <rect x="118" y="168" width="64" height="44" fill="none" stroke="#e50914" stroke-width="2.5" rx="6" opacity="0.8"/>
  <circle cx="150" cy="190" r="14" fill="none" stroke="#e50914" stroke-width="2.5" opacity="0.8"/>
  <circle cx="150" cy="190" r="7" fill="#e50914" opacity="0.4"/>
  <rect x="130" y="162" width="20" height="10" fill="none" stroke="#e50914" stroke-width="2" rx="3" opacity="0.8"/>
  <circle cx="170" cy="172" r="4" fill="#e50914" opacity="0.6"/>

  <!-- PRAFLIX brand text -->
  <text x="150" y="268" font-family="'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="4" opacity="0.95">PRAFLIX</text>
  <text x="150" y="286" font-family="'Helvetica Neue', Arial, sans-serif" font-size="8" fill="#e50914" text-anchor="middle" letter-spacing="2" opacity="0.7">A PRAVERSE COMPANY</text>

  <!-- Divider line -->
  <line x1="50" y1="300" x2="250" y2="300" stroke="#e50914" stroke-width="1" opacity="0.3"/>

  <!-- Status text -->
  <text x="150" y="325" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#8896a8" text-anchor="middle" letter-spacing="1">POSTER NOT AVAILABLE</text>
</svg>
